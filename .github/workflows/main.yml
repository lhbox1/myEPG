name: 'Update schedule'
# 关键：授予写入权限
permissions:
  contents: write
  actions: write # 清理运行记录必须的权限

on:
  schedule:
    - cron: '22 3 */3 * *'
  workflow_dispatch:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependencies
        run: |
          pipenv lock
          pipenv --python 3.13
          pipenv install

      - name: Update EPG
        run: pipenv run epg

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          [[ -f "output/epg.xml" ]] && git add -f "output/epg.xml"
          [[ -f "output/epg.gz" ]] && git add -f "output/epg.gz"
          
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push origin master
          fi

      # 🟢 方法二：直接在当前 Job 的最后一步执行清理
      - name: Clear old workflow runs natively
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching completed workflow runs..."
          # 获取已完成的任务，扩大单次查询量至 500，跳过最新的 3 个记录
          RUN_IDS=$(gh run list --workflow "${{ github.workflow }}" --status completed --limit 500 --json databaseId --jq '.[].databaseId' | tail -n +4)
          
          if [ -z "$RUN_IDS" ]; then
            echo "No old runs to delete."
          else
            for RUN_ID in $RUN_IDS; do
              echo "Deleting run ID: $RUN_ID"
              gh run delete "$RUN_ID"
              sleep 0.5 # 延迟 0.5 秒，防止触发 GitHub API 限流
            done
            echo "Cleanup completed."
          fi
